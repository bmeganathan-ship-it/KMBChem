 soi:"Relationships between elements drive transformations — such as the interaction between acids and bases — that scientists use as evidence to predict and control chemical change.",

{id:"l1",code:"2.1",title:"The pH scale and indicators",crit:"A",tool:"ph",

 hook:"Your stomach acid is about pH 1.5 and your blood is about pH 7.4. How can a small change in a number mean the difference between digesting food and dissolving it?",

 ideas:["pH runs from 0 to 14. Below 7 is acidic, 7 is neutral, above 7 is alkaline.","Acids release {H+} ions in water. Alkalis release {OH-} ions in water.","Each step of 1 pH unit is a 10× change in {H+} concentration. pH 3 has 10× more {H+} than pH 4.","An indicator is a dye that changes colour depending on pH. Universal indicator shows a range of colours, so it gives an approximate pH value."],

  {q:"A colourless solution turns phenolphthalein pink and universal indicator purple. What can you say about it?",steps:["Phenolphthalein turns pink only above about pH 8.2, so the solution is alkaline.","Purple on universal indicator means about pH 12–14.","So it is a strongly alkaline solution with a high concentration of OH⁻ ions."],a:"Strong alkali, pH ≈ 12–14 (e.g. sodium hydroxide solution)."}],
 practice:[
  {q:"Which pH shows the strongest acid?",o:["pH 6","pH 4","pH 1","pH 8"],c:2,w:"The lower the pH, the higher the H⁺ concentration, so pH 1 is the most acidic."},
  {q:"Methyl orange is added to a solution of pH 9. What colour is seen?",o:["Red","Orange","Yellow","Colourless"],c:2,w:"Methyl orange is red below pH 3.1 and yellow above pH 4.4, so it is yellow at pH 9."},
  {q:"Solution X has pH 3 and solution Y has pH 5. Which statement is correct?",o:["Y has 2× more H⁺ than X","X has 100× more H⁺ than Y","X has 2× more H⁺ than Y","They have the same H⁺"],c:1,w:"A difference of 2 pH units is 10 × 10 = 100 times."}],
 express:[["Sketch","Draw and label a pH scale with 6 everyday substances."],["Explain aloud","Record a 60-second voice note explaining why pH 3 is 10× more acidic than pH 4."],["Table","Make an indicator colour table for 4 indicators."],["Teach it","Make a 3-question quiz for a partner."]],
 exit:["Give one acid, one alkali and one neutral substance with approximate pH values.","Why is universal indicator more useful than litmus?"],
 teacher:{timing:[["0–5","Hook: stomach acid vs blood. Think-pair-share."],["5–15","Demo: universal indicator with 8 household samples (vinegar, lemon juice, soap, baking soda, bleach (teacher only), milk of magnesia, tap water, cola). Students predict, then observe."],["15–30","pH explorer tool + key ideas. Model the 10× rule with worked example 1."],["30–45","Indicator stations (litmus, methyl orange, phenolphthalein). Students complete colour table."],["45–55","Practice questions; choose one Express task."],["55–60","Exit ticket + confidence rating."]],
  mis:["'pH 4 is twice as acidic as pH 2' — wrong: lower pH is more acidic, and the scale is logarithmic.","'Alkalis are safe because they aren't acids' — strong alkalis are corrosive.","'Neutral means no ions' — pure water contains equal, small amounts of H⁺ and OH⁻."],
  support:"Word bank with colour cards; pre-labelled pH scale to complete; sentence frame: 'The solution is ___ because the indicator turned ___ which means pH ___.'",
  ext:"Introduce pH = −log[H⁺]: calculate the pH of 0.01 mol/dm³ HCl (pH 2). Why can pH go below 0?",
  safety:"Eye protection. Teacher handles bleach and any concentrated samples. Phenolphthalein solution contains ethanol (flammable).",
  check:"Mini-whiteboards: show a pH value, students hold up the indicator colour."}},

{id:"l2",code:"2.2",title:"Properties and reactions of acids",crit:"A",tool:"react",
 obj:["I can predict the salt formed when an acid reacts with a metal, metal oxide, metal hydroxide or carbonate.","I can write word and balanced symbol equations for these reactions.","I can describe the tests for hydrogen and carbon dioxide."],
 hook:"Drop a piece of magnesium ribbon into acid and it fizzes and disappears. Where does the metal go, and what is the gas?",
 why:"Acid reactions are used to make fertilisers, clean metals before painting, and are why marble statues and limestone buildings wear away in acid rain.",
 choices:[["Station rotation","Carry out all four reaction types at practical stations."],["Builder first","Use the reaction builder to predict, then test two at the bench."],["Pattern hunter","Find the rule that names every salt from its acid."]],
 ideas:["acid + metal → salt + hydrogen","acid + metal oxide → salt + water","acid + metal hydroxide → salt + water","acid + metal carbonate → salt + water + carbon dioxide","The acid decides the salt's family: hydrochloric → chlorides, sulfuric → sulfates, nitric → nitrates.","Test for {H2}: a lit splint gives a squeaky pop. Test for {CO2}: limewater turns milky (cloudy)."],
 vocab:[["Salt","A compound formed when the H⁺ of an acid is replaced by a metal or ammonium ion."],["Effervescence","Fizzing caused by a gas being produced."],["Balanced equation","Equation with the same number of each atom on both sides."],["Limewater","Calcium hydroxide solution; goes milky with CO₂."]],
 worked:[
  {q:"Write the word and balanced symbol equation for zinc reacting with hydrochloric acid.",steps:["Type: acid + metal → salt + hydrogen.","Hydrochloric acid makes a chloride: zinc chloride.","Word equation: zinc + hydrochloric acid → zinc chloride + hydrogen.","Formulae: Zn + HCl → ZnCl2 + H2.","Balance chlorine and hydrogen: put 2 in front of HCl."],a:"Zn + 2HCl → ZnCl2 + H2"},
  {q:"Write the balanced equation for calcium carbonate reacting with nitric acid.",steps:["Type: acid + carbonate → salt + water + carbon dioxide.","Nitric acid makes a nitrate: calcium nitrate, Ca(NO3)2 (Ca²⁺ needs two NO₃⁻).","Unbalanced: CaCO3 + HNO3 → Ca(NO3)2 + H2O + CO2.","Two nitrates on the right, so 2HNO3 on the left. Check H: 2 = 2. Check O: 3 + 6 = 6 + 1 + 2."],a:"CaCO3 + 2HNO3 → Ca(NO3)2 + H2O + CO2"}],
 practice:[
  {q:"Which salt forms when copper(II) oxide reacts with sulfuric acid?",o:["Copper chloride","Copper sulfate","Copper nitrate","Copper carbonate"],c:1,w:"Sulfuric acid always produces sulfates."},
  {q:"A gas from a reaction turns limewater milky. Which reactant was added to the acid?",o:["Magnesium","Sodium hydroxide","Sodium carbonate","Copper oxide"],c:2,w:"Only carbonates give carbon dioxide, which turns limewater milky."},
  {q:"Which equation is correctly balanced?",o:["Mg + HCl → MgCl2 + H2","Mg + 2HCl → MgCl2 + H2","2Mg + HCl → MgCl2 + H2","Mg + 2HCl → MgCl + H2"],c:1,w:"MgCl₂ has 2 Cl, so you need 2HCl, which also gives the 2 H in H₂."}],
 express:[["Flow chart","Make a flow chart of the 4 reaction types with one example each."],["Lab video","Film a 30-second clip of one reaction and narrate the observations."],["Equation cards","Write 6 balanced equations on cards for a matching game."],["Comic","Draw a 4-panel comic of a metal 'meeting' an acid."]],
 exit:["Predict the products of magnesium oxide + hydrochloric acid and write the balanced equation.","How would you prove a gas is hydrogen?"],
 teacher:{timing:[["0–5","Hook demo: Mg ribbon in 1 mol/dm³ HCl; collect gas, squeaky-pop test."],["5–15","Model the four general equations and the naming rule (key ideas)."],["15–35","Practical stations (Mg, CuO warmed, NaOH + indicator, CaCO3 chips + limewater). Record observations in a table."],["35–45","Worked examples 1–2 under the visualiser; reaction builder for self-check."],["45–55","Practice questions + Express choice."],["55–60","Exit ticket."]],
  mis:["Thinking the metal 'disappears' — it becomes ions in solution (aqueous salt).","Writing MgCl instead of MgCl₂ — revisit ion charges.","Thinking all acid reactions give hydrogen."],
  support:"Partially completed equation frames; ion charge card (Na⁺, Mg²⁺, Ca²⁺, Zn²⁺, Cu²⁺, Cl⁻, SO₄²⁻, NO₃⁻, CO₃²⁻).",
  ext:"Write ionic equations, e.g. 2H⁺(aq) + CO₃²⁻(aq) → H₂O(l) + CO₂(g). Why do nitric acid and metals often give nitrogen oxides instead of hydrogen?",
  safety:"Eye protection. Dilute acids only (≤1 mol/dm³). Warm CuO gently — no boiling. Extinguish splints.",
  check:"Cold-call: name the salt from any acid + reactant pair."}},

{id:"l3",code:"2.3",title:"Bases and alkalis",crit:"A",tool:null,
 obj:["I can explain the difference between a base and an alkali.","I can name common alkalis and describe their uses.","I can write the ionic equation for neutralisation."],
 hook:"All alkalis are bases, but not all bases are alkalis. Can you work out why before the end of the lesson?",
 why:"Alkalis are in soap, oven cleaner and indigestion tablets. Farmers spread lime (a base) on acidic fields so crops can grow.",
 choices:[["Card sort","Sort 12 substance cards into bases, alkalis and neither."],["Solubility test","Test whether CuO, MgO, NaOH and CaO dissolve and change indicator."],["Venn diagram","Build a Venn diagram of bases and alkalis."]],
 ideas:["A base is a substance that reacts with an acid to form a salt and water (metal oxides and hydroxides).","An alkali is a base that dissolves in water and releases {OH-} ions.","Common alkalis: sodium hydroxide {NaOH}, potassium hydroxide {KOH}, calcium hydroxide {Ca(OH)2}, ammonia solution {NH3}(aq).","Ammonia makes OH⁻ by reacting with water: {NH3} + {H2O} ⇌ {NH4+} + {OH-}.","Neutralisation in every acid–alkali reaction: {H+}(aq) + {OH-}(aq) → {H2O}(l)."],
 vocab:[["Base","Reacts with an acid to give a salt and water."],["Alkali","A soluble base; gives OH⁻ ions in water."],["Neutralisation","Reaction of H⁺ with OH⁻ (or a base) to form water."],["Insoluble","Does not dissolve in water."]],
 worked:[
  {q:"Copper(II) oxide is a base but not an alkali. Explain why.",steps:["A base reacts with an acid to give salt + water. CuO + H2SO4 → CuSO4 + H2O, so CuO is a base.","An alkali must dissolve in water to give OH⁻ ions.","CuO is insoluble in water, so it releases no OH⁻ ions and does not change indicator colour."],a:"CuO neutralises acids (base) but is insoluble, so it is not an alkali."},
  {q:"Write the ionic equation for potassium hydroxide reacting with nitric acid.",steps:["Full equation: KOH + HNO3 → KNO3 + H2O.","Split into ions: K⁺ + OH⁻ + H⁺ + NO₃⁻ → K⁺ + NO₃⁻ + H₂O.","Remove spectator ions (K⁺ and NO₃⁻) that appear on both sides."],a:"H⁺(aq) + OH⁻(aq) → H₂O(l)"}],
 practice:[
  {q:"Which of these is an alkali?",o:["Copper(II) oxide","Magnesium oxide (insoluble)","Sodium hydroxide","Iron(III) oxide"],c:2,w:"NaOH is soluble and gives OH⁻ ions in water."},
  {q:"What are the spectator ions when NaOH reacts with HCl?",o:["H⁺ and OH⁻","Na⁺ and Cl⁻","Na⁺ and OH⁻","H⁺ and Cl⁻"],c:1,w:"Na⁺ and Cl⁻ are unchanged; only H⁺ and OH⁻ react."},
  {q:"Why is calcium hydroxide spread on fields?",o:["To add acid to soil","To neutralise acidic soil","To kill all bacteria","To make the soil wetter"],c:1,w:"Ca(OH)₂ is a base, so it neutralises excess acid in soil."}],
 express:[["Venn","Draw the bases/alkalis Venn diagram with 3 examples in each part."],["Advert","Design an advert for an antacid explaining the chemistry."],["Explain","Write 4 sentences explaining the hook question."]],
 exit:["Define base and alkali in your own words.","Write the ionic equation for neutralisation."],
 teacher:{timing:[["0–5","Hook question; students note a first guess."],["5–20","Solubility + indicator test on CuO, MgO, CaO, NaOH (teacher demo for NaOH pellets)."],["20–30","Key ideas; build Venn diagram as a class."],["30–40","Worked examples incl. spectator ions."],["40–55","Card sort/choice + practice."],["55–60","Return to hook; exit ticket."]],
  mis:["'Base' and 'alkali' used as synonyms.","Thinking ammonia contains OH⁻ — it makes OH⁻ by reacting with water.","Spectator ions 'do nothing' so they are left out of the salt."],
  support:"Pre-drawn Venn with labelled cards to place; visual of ions as coloured circles.",
  ext:"Brønsted–Lowry preview: an acid is a proton (H⁺) donor and a base is a proton acceptor. Identify the acid and base in NH₃ + H₂O ⇌ NH₄⁺ + OH⁻.",
  safety:"Teacher handles solid NaOH (corrosive). CaO reacts exothermically with water.",
  check:"Thumbs up/down on 6 rapid statements ('MgO is an alkali')."}},

{id:"l4",code:"2.4",title:"Oxides: acidic, basic and amphoteric",crit:"A",tool:"oxide",
 obj:["I can classify oxides as acidic, basic, amphoteric or neutral.","I can relate an oxide's character to whether its element is a metal or non-metal.","I can write equations for amphoteric oxides reacting with acid and alkali."],
 hook:"Burn sulfur and dissolve the gas in water: the indicator goes red. Burn magnesium and do the same: it goes blue. Same reaction with oxygen, opposite results. Why?",
 why:"Sulfur and nitrogen oxides from power stations and vehicles cause acid rain. Basic oxides like CaO are used to remove these gases from factory chimneys.",
 choices:[["Test & sort","React oxide samples with acid and alkali, then classify."],["Periodic map","Colour a periodic table by oxide type."],["Classifier tool","Use the oxide classifier and explain your mistakes."]],
 ideas:["Metal oxides are usually basic: they react with acids, e.g. {MgO}, {CaO}, {Na2O}, {CuO}.","Non-metal oxides are usually acidic: they react with alkalis and form acids in water, e.g. {CO2}, {SO2}, {P4O10}, {NO2}.","Amphoteric oxides react with both acids and alkalis: {Al2O3}, {ZnO}.","Neutral oxides react with neither: {CO}, {NO}, {H2O}.","Across period 3 the oxides change from basic ({Na2O}) through amphoteric ({Al2O3}) to acidic ({SO2}, {P4O10})."],
 vocab:[["Acidic oxide","Oxide that reacts with alkalis; often forms an acid in water."],["Basic oxide","Oxide that reacts with acids to form salt + water."],["Amphoteric","Reacts with both acids and alkalis."],["Neutral oxide","Reacts with neither acids nor alkalis."]],
 worked:[
  {q:"Zinc oxide is amphoteric. Write equations for its reaction with hydrochloric acid and with sodium hydroxide.",steps:["With acid (ZnO acts as a base): ZnO + 2HCl → ZnCl2 + H2O.","With alkali (ZnO acts as an acid): the product is sodium zincate.","ZnO + 2NaOH → Na2ZnO2 + H2O.","Reacting with both is the evidence that ZnO is amphoteric."],a:"ZnO + 2HCl → ZnCl2 + H2O and ZnO + 2NaOH → Na2ZnO2 + H2O"},
  {q:"Predict the nature of selenium dioxide, SeO₂. Selenium is in group 16, below sulfur.",steps:["Selenium is a non-metal (like sulfur).","Non-metal oxides are usually acidic; SO₂ is acidic.","So SeO₂ will react with alkalis and form an acid in water."],a:"SeO₂ is an acidic oxide."}],
 practice:[
  {q:"Which oxide is amphoteric?",o:["MgO","SO2","Al2O3","CO"],c:2,w:"Aluminium oxide reacts with both acids and alkalis."},
  {q:"A gas dissolves in water to give pH 4 and reacts with NaOH. It is most likely…",o:["CaO","CO2","Na2O","CO"],c:1,w:"CO₂ is a non-metal oxide: acidic, forms carbonic acid in water."},
  {q:"Carbon monoxide is classed as…",o:["Acidic","Basic","Amphoteric","Neutral"],c:3,w:"CO reacts with neither acids nor alkalis."}],
 express:[["Periodic map","Colour-code period 3 oxides and annotate the trend."],["Lab report","Write the method and results for testing 4 oxides."],["Infographic","Make an infographic: 'Where does acid rain come from?'"]],
 exit:["Classify: Na₂O, SO₃, ZnO, NO.","What evidence shows an oxide is amphoteric?"],
 teacher:{timing:[["0–8","Hook demo (fume cupboard): burn S and Mg, dissolve products, add universal indicator."],["8–25","Inquiry: students test MgO, CuO, ZnO, Al₂O₃ with dilute HCl and dilute NaOH; classify before terms are given."],["25–35","Introduce terms; link to metal/non-metal (Thinker attribute)."],["35–45","Worked examples; oxide classifier tool."],["45–55","Practice + Express choice."],["55–60","Exit ticket."]],
  mis:["'All oxides are bases.'","'Amphoteric means neutral.'","'Water is an acidic oxide because rain is acidic.'"],
  support:"Colour-coded periodic table (metals blue, non-metals pink); classification flow chart.",
  ext:"Explain the trend across period 3 using bonding (ionic → covalent) and electronegativity.",
  safety:"Burning sulfur only in a fume cupboard (SO₂ is toxic). Do not look directly at burning Mg. Dilute NaOH ≤0.5 mol/dm³ for student work.",
  check:"Hinge question: 'An oxide reacts with NaOH but not HCl. Is its element a metal?'"}},

{id:"l5",code:"2.5",title:"Preparation of salts",crit:"A",tool:"salt",
 obj:["I can choose the right method to make a given salt.","I can describe how to make a pure, dry soluble salt by the excess method.","I can describe how to make an insoluble salt by precipitation."],
 hook:"Copper sulfate crystals are bright blue. You start with a black powder and a colourless acid. How do you end up with blue crystals?",
 why:"Salt preparation is how fertilisers like ammonium nitrate are made, and how barium sulfate is made for medical X-rays.",
 choices:[["Method detective","Use the method chooser for 10 salts."],["Make crystals","Prepare copper sulfate crystals by the excess method."],["Storyboard","Storyboard the steps of making a salt."]],
 ideas:["Step 1: Is the salt soluble? Use solubility rules: all sodium, potassium, ammonium and nitrate salts are soluble; most chlorides and sulfates are soluble.","Soluble salt from an insoluble base, metal or carbonate → excess method: add excess solid to acid, filter, evaporate, crystallise.","Soluble salt of sodium, potassium or ammonium → titration: find the exact volumes, then repeat without indicator and crystallise.","Insoluble salt → precipitation: mix two soluble solutions, filter, wash with distilled water, dry.","Insoluble examples: {AgCl}, {BaSO4}, {PbI2}, {CaCO3}."],
 vocab:[["Excess","More than is needed, so all the acid reacts."],["Filtrate","Liquid that passes through filter paper."],["Residue","Solid left on filter paper."],["Precipitate","Insoluble solid formed when two solutions are mixed."],["Crystallisation","Forming crystals as a saturated solution cools."]],
 worked:[
  {q:"Describe how to make pure, dry copper(II) sulfate crystals from copper(II) oxide.",steps:["Warm dilute sulfuric acid in a beaker.","Add copper(II) oxide a little at a time, stirring, until no more dissolves (excess black solid remains). This makes sure all the acid is used up.","Filter to remove the excess CuO. The blue filtrate is copper sulfate solution.","Heat the filtrate gently to evaporate some water until crystals start to form (saturated).","Leave to cool and crystallise. Filter off the crystals and dry them between filter papers."],a:"CuO + H2SO4 → CuSO4 + H2O; method: excess, filter, evaporate, crystallise, dry."},
  {q:"Choose two solutions to make barium sulfate and write the equation.",steps:["BaSO₄ is insoluble, so use precipitation.","Need a soluble barium salt: barium chloride, BaCl₂(aq).","Need a soluble sulfate: sodium sulfate, Na₂SO₄(aq).","Mix, filter, wash the precipitate with distilled water, dry."],a:"BaCl2(aq) + Na2SO4(aq) → BaSO4(s) + 2NaCl(aq)"}],
 practice:[
  {q:"Which method makes sodium chloride?",o:["Excess method","Titration","Precipitation","Filtration only"],c:1,w:"NaOH is soluble so you can't see when it's in excess; titration finds the exact amount."},
  {q:"Why is the excess solid added in the excess method?",o:["To make the salt insoluble","To make sure all the acid reacts","To speed up evaporation","To change the colour"],c:1,w:"Excess guarantees no acid is left in the salt solution; the extra solid is filtered off."},
  {q:"Which salt is made by precipitation?",o:["Zinc chloride","Silver chloride","Magnesium sulfate","Potassium nitrate"],c:1,w:"AgCl is insoluble."}],
 express:[["Storyboard","Draw the 5 steps of the excess method with labelled apparatus."],["Method card","Write a method card a Grade 8 student could follow."],["Decision tree","Draw your own 'Which method?' decision tree."]],
 exit:["Which method would you use to make zinc chloride? Why?","Why do we wash a precipitate with distilled water?"],
 teacher:{timing:[["0–5","Hook: show CuO, H₂SO₄ and a CuSO₄ crystal."],["5–15","Solubility rules + decision tree (key ideas)."],["15–40","Practical: copper sulfate by excess method (crystallise next lesson)."],["40–50","Precipitation demo: BaCl₂ + Na₂SO₄ or AgNO₃ + NaCl; method chooser tool."],["50–60","Practice + exit ticket."]],
  mis:["Evaporating to dryness — gives powder, can decompose hydrated crystals.","Thinking the excess solid is part of the product.","Forgetting to wash the precipitate."],
  support:"Picture-based method cards to sequence; solubility rules table on desk.",
  ext:"Calculate the theoretical yield of CuSO₄·5H₂O from 25.0 cm³ of 1.00 mol/dm³ H₂SO₄ (0.0250 mol × 249.7 g/mol = 6.24 g) and percentage yield from class results.",
  safety:"Eye protection. Heat gently; do not boil to dryness (spitting). Copper sulfate is harmful; barium chloride is toxic (teacher demo); silver nitrate stains skin.",
  check:"Show a salt formula; students show 1 (excess), 2 (titration) or 3 (precipitation) fingers."}},

{id:"l6",code:"2.6",title:"Neutralisation and titration",crit:"A / C",tool:"titr",
 obj:["I can carry out a titration using a burette, pipette and indicator.","I can identify concordant titres and calculate a mean titre.","I can calculate an unknown concentration from titration data."],
 hook:"A factory must neutralise its acidic waste before it reaches the river. Add too little alkali and fish die; add too much and the river becomes alkaline. How do chemists find the exact amount?",
 why:"Titration is used in water treatment, food quality control (vinegar, fruit juice) and medicine. It is also the core technique for your Criterion C investigation.",
 choices:[["Simulator first","Practise on the virtual titration before using glassware."],["Straight to the bench","Do a rough titration then 3 accurate ones."],["Calculation coach","Work through the worked examples step by step."]],
 ideas:["A pipette measures a fixed volume (e.g. 25.0 cm³) accurately into a conical flask.","A burette adds the second solution until the indicator just changes colour: the end point.","Do a rough titration first, then accurate ones adding drop by drop near the end point. Read the bottom of the meniscus at eye level.","Concordant titres agree within 0.10 cm³. Use only concordant titres for the mean.","Calculation: moles = concentration × volume (in dm³). Use the mole ratio from the equation. Concentration = moles ÷ volume (dm³). 1 dm³ = 1000 cm³."],
 vocab:[["Titre","Volume added from the burette to reach the end point."],["End point","When the indicator just changes colour."],["Concordant","Titres within 0.10 cm³ of each other."],["Meniscus","Curved surface of a liquid in glassware."],["mol/dm³","Unit of concentration: moles per cubic decimetre."]],
 worked:[
  {q:"25.0 cm³ of NaOH (0.100 mol/dm³) needed 20.00 cm³ of HCl to neutralise it. Find the concentration of the HCl.",steps:["Equation: NaOH + HCl → NaCl + H2O (ratio 1 : 1).","Moles NaOH = 0.100 × (25.0 ÷ 1000) = 0.00250 mol.","Moles HCl = 0.00250 mol (1 : 1).","Concentration HCl = 0.00250 ÷ (20.00 ÷ 1000) = 0.125 mol/dm³."],a:"0.125 mol/dm³"},
  {q:"25.0 cm³ of NaOH (0.200 mol/dm³) needed 22.50 cm³ of H₂SO₄. Find the H₂SO₄ concentration.",steps:["Equation: 2NaOH + H2SO4 → Na2SO4 + 2H2O (ratio 2 : 1).","Moles NaOH = 0.200 × 0.0250 = 0.00500 mol.","Moles H₂SO₄ = 0.00500 ÷ 2 = 0.00250 mol.","Concentration = 0.00250 ÷ 0.02250 = 0.111 mol/dm³ (3 s.f.)."],a:"0.111 mol/dm³"},
  {q:"Titres: rough 24.6, then 24.15, 24.35, 24.20 cm³. Find the mean titre.",steps:["Ignore the rough titre.","Check which agree within 0.10 cm³: 24.15 and 24.20 (difference 0.05). 24.35 is 0.20 from 24.15, so not concordant.","Mean = (24.15 + 24.20) ÷ 2 = 24.175 → 24.18 cm³ (2 d.p., burette precision)."],a:"Mean titre = 24.18 cm³"}],
 practice:[
  {q:"Which piece of apparatus measures the titre?",o:["Pipette","Measuring cylinder","Burette","Conical flask"],c:2,w:"The burette delivers and measures the variable volume."},
  {q:"Moles in 20.0 cm³ of 0.50 mol/dm³ HCl?",o:["10 mol","0.010 mol","0.10 mol","0.025 mol"],c:1,w:"0.50 × 20.0/1000 = 0.010 mol."},
  {q:"Why swirl the flask during a titration?",o:["To warm it","To mix the solutions so the colour change is seen accurately","To make bubbles","To dissolve the indicator"],c:1,w:"Swirling mixes the solutions so the end point isn't overshot."}],
 express:[["Data analysis","Find the unknown acid concentration from the simulator and show working."],["How-to video","Film your titration technique with a voice-over."],["Error poster","Make a poster of 5 titration errors and how to avoid them."]],
 exit:["What does 'concordant' mean?","Calculate moles in 15.0 cm³ of 0.200 mol/dm³ NaOH."],
 teacher:{timing:[["0–5","Hook: factory waste scenario."],["5–15","Teacher models technique: rinsing, filling burette, pipette filler, reading the meniscus."],["15–25","Simulator practice (pairs), finding the unknown concentration."],["25–45","Bench titration: rough + 3 accurate; record to 2 d.p."],["45–55","Worked examples 1–3; calculation practice."],["55–60","Exit ticket."]],
  mis:["Using cm³ in calculations without ÷1000.","Including the rough titre in the mean.","Recording 24.2 instead of 24.20 (precision).","Forgetting the 2 : 1 ratio with H₂SO₄."],
  support:"Calculation frame: moles known → ratio → moles unknown → concentration. Large-print burette diagram for meniscus reading.",
  ext:"Back-titration problem: find the mass of CaCO₃ in an antacid tablet. Sketch a pH curve for strong acid / strong alkali and mark the equivalence point.",
  safety:"Eye protection. Use a pipette filler — never mouth pipette. Fill burette below eye level with a funnel; remove funnel before titrating.",
  check:"Simulator answer check (God mode shows the unknown concentration)."}},

{id:"l7",code:"2.7",title:"Elemental interactions and reactivity trends",crit:"A",tool:"trend",
 obj:["I can describe reactivity trends down groups 1 and 17 and across period 3.","I can predict how an unfamiliar element or its oxide reacts with acid or water.","I can justify predictions using position in the periodic table and electron arrangement."],
 hook:"Lithium fizzes gently in water, sodium melts into a ball and whizzes around, potassium bursts into lilac flame. What would caesium do, and why?",
 why:"Predicting reactivity lets chemists handle new materials safely, choose metals for batteries, and pick which metals resist corrosion in buildings.",
 choices:[["Predict & test","Predict, then watch the group 1 demonstration."],["Trend explorer","Use the period 3 explorer to see oxide patterns."],["Data detective","Use melting point and reactivity data to spot trends."]],
 ideas:["Group 1 metals react with water: metal + water → metal hydroxide + hydrogen. Reactivity increases down the group because the outer electron is further from the nucleus and more easily lost.","Reactivity series with acids: K > Na > Ca > Mg > Al > Zn > Fe > (H) > Cu > Ag. Metals below hydrogen do not react with dilute acids.","Group 17 reactivity decreases down the group: a halogen gains an electron less easily when the atom is larger.","Across period 3: Na, Mg form basic oxides; Al forms an amphoteric oxide; Si, P, S form acidic oxides."],
 vocab:[["Reactivity","How readily an element takes part in a reaction."],["Reactivity series","Metals ranked from most to least reactive."],["Shielding","Inner electrons reduce the nucleus's pull on outer electrons."],["Group / period","Column / row of the periodic table."]],
 worked:[
  {q:"Predict what happens when rubidium (group 1) reacts with dilute hydrochloric acid, and write the equation.",steps:["Rb is below K in group 1, so it is even more reactive (outer electron further from the nucleus).","Metal + acid → salt + hydrogen. Rb forms Rb⁺, so the salt is RbCl.","2Rb + 2HCl → 2RbCl + H2.","Prediction: explosive reaction — this would never be done in school."],a:"2Rb + 2HCl → 2RbCl + H2; extremely violent."},
  {q:"Strontium (group 2) forms SrO. Predict its reaction with hydrochloric acid.",steps:["Sr is a metal, so SrO is a basic oxide.","Basic oxide + acid → salt + water.","Sr²⁺ needs two Cl⁻: SrCl₂."],a:"SrO + 2HCl → SrCl2 + H2O"}],
 practice:[
  {q:"Which metal will NOT react with dilute HCl?",o:["Zinc","Iron","Copper","Magnesium"],c:2,w:"Copper is below hydrogen in the reactivity series."},
  {q:"Why is potassium more reactive than sodium?",o:["It has more protons so holds electrons tighter","Its outer electron is further from the nucleus and lost more easily","It is a non-metal","It has fewer electrons"],c:1,w:"More shells → more shielding and distance → outer electron lost more easily."},
  {q:"The oxide of phosphorus is…",o:["Basic","Amphoteric","Acidic","Neutral"],c:2,w:"Phosphorus is a non-metal; P₄O₁₀ is acidic."}],

{id:"l8",code:"2.8",title:"Acids and bases in the real world",crit:"D",tool:"case",

 choices:[["Acid rain","Sulfur and nitrogen oxides from industry and transport."],["Soil pH and farming","Liming acidic soils for maize and other crops."],["Antacids","How indigestion tablets neutralise stomach acid."],["Industrial waste","Neutralising acidic factory effluent."]],
 ideas:["Natural rain is slightly acidic (about pH 5.6) because {CO2} dissolves to form carbonic acid. Acid rain has a lower pH.","Acid rain: {SO2} and nitrogen oxides from burning fuels form sulfuric and nitric acid in clouds, e.g. 2{SO2} + {O2} + 2{H2O} → 2{H2SO4}.","Liming: {CaCO3} + 2{H+} → {Ca2+} + {H2O} + {CO2} raises soil pH.","Antacids: {Mg(OH)2} + 2{HCl} → {MgCl2} + 2{H2O}.","Criterion D asks you to explain how science is applied, evaluate its implications, use scientific language, and cite your sources."],
 vocab:[["Implication","A consequence: environmental, economic, social or ethical."],["Flue gas desulfurisation","Removing SO₂ from chimney gases using a base (e.g. CaO)."],["Agricultural lime","Powdered limestone (CaCO₃) used to reduce soil acidity."],["Citation","A reference showing where information came from."]],
 worked:[

 practice:[
  {q:"Why is normal rain slightly acidic?",o:["It contains SO₂ from volcanoes only","CO₂ dissolves to form carbonic acid","It contains HCl","Clouds are made of acid"],c:1,w:"Atmospheric CO₂ makes rain about pH 5.6."},
  {q:"Which substance is used to remove SO₂ from power-station chimneys?",o:["Sulfuric acid","Calcium oxide / calcium carbonate","Sodium chloride","Carbon dioxide"],c:1,w:"A basic substance neutralises the acidic SO₂."},
  {q:"Which is an economic implication of liming fields?",o:["Soil pH increases","Farmers must pay for lime and transport","CO₂ is produced","Ca²⁺ ions form"],c:1,w:"Economic implications are about cost and money."}],
 express:[["Article","Write a 300-word article for a local newspaper."],["Infographic","Design an infographic for farmers or the public."],["Presentation","Give a 3-minute talk with 4 slides."],["Podcast","Record a 3-minute podcast interview."]],
 exit:["Name one environmental, one economic and one social implication of your case study.","Which source did you use, and why do you trust it?"],

  mis:["Implications listed without explaining the link to the chemistry.","Copying technical text instead of translating it for the audience.","Uncited facts and images."],

{id:"l9",code:"2.9",title:"Criteria B & C: acid–base investigation",crit:"B / C",tool:"inv",
 obj:["I can design a fair-test investigation with independent, dependent and controlled variables.","I can present processed titration data with correct units and precision.","I can evaluate my hypothesis and method and suggest realistic improvements."],
 hook:"You are the scientist now. Choose one variable, predict its effect, and gather evidence that convinces someone else.",
 why:"This investigation is assessed on Criterion B (design) and Criterion C (processing and evaluating). Criterion C is due Friday 20 November.",
 choices:[["Acid concentration","Effect of acid concentration on the titre."],["Type of acid","HCl vs H₂SO₄ at the same concentration."],["Antacid brand","Which antacid neutralises the most acid?"],["Temperature rise","Effect of acid volume on temperature rise when neutralising."]],
 ideas:["Research question: 'How does [IV] affect [DV] when …?' Make it specific and measurable.","Hypothesis: If … then … because … (use scientific reasoning: moles, ratio, H⁺ concentration).","Variables: one independent (you change), one dependent (you measure), several controlled (you keep the same and say how).","Data: raw data table with units and uncertainty in the headings (burette ±0.05 cm³). Processed data: mean of concordant titres, then a graph.","Evaluation: Is the hypothesis supported? Identify specific errors (end-point judgement, parallax), their effect, and a realistic improvement."],
 vocab:[["Independent variable","The variable you change."],["Dependent variable","The variable you measure."],["Uncertainty","The range a measurement could be out by, e.g. ±0.05 cm³."],["Validity","Whether the method fairly tests the hypothesis."],["Anomaly","A result that does not fit the pattern."]],
 worked:[
  {q:"Write a hypothesis for: 'How does the concentration of HCl affect the volume needed to neutralise 25.0 cm³ of 0.100 mol/dm³ NaOH?'",steps:["If … : If the concentration of HCl increases,","then … : then the titre will decrease,","because … : because each cm³ contains more moles of H⁺, so fewer cm³ are needed to react with the fixed 0.00250 mol of OH⁻ (1 : 1 ratio).","Quantitative bonus: titre ∝ 1/concentration — doubling the concentration should halve the titre."],a:"If [HCl] increases, the titre decreases (inversely proportional) because more moles of H⁺ are present per cm³."},
  {q:"Turn this weak evaluation into a strong one: 'I would be more careful next time.'",steps:["Name the specific error: 'The pink colour was hard to judge, so I may have overshot the end point.'","Say its effect: 'This would make my titres too large, so the calculated concentration would be too low.'","Give a realistic improvement: 'Use a white tile under the flask and add the alkali drop by drop near the end point; repeat until two titres agree within 0.10 cm³.'"],a:"Error → effect on results → specific improvement."}],
 practice:[
  {q:"In an antacid investigation, which is a controlled variable?",o:["Brand of antacid","Volume of acid neutralised","Concentration of HCl used","Number of tablets that dissolve"],c:2,w:"The acid concentration must stay the same for a fair comparison."},
  {q:"A burette reads 23.4 cm³. How should it be recorded?",o:["23 cm³","23.4 cm³","23.40 cm³","23.400 cm³"],c:2,w:"Burettes are read to 2 decimal places (to the nearest 0.05 cm³)."},
  {q:"Which is a valid improvement?",o:["Be more careful","Use better equipment","Use a white tile and add drop by drop near the end point","Do it faster"],c:2,w:"Improvements must be specific and realistic."}],
 express:[["Written report","Standard lab report using the scaffold template."],["Annotated slides","Report as annotated slides with your graph."],["Oral + data","Present data and evaluation orally, with your table and graph."]],
 exit:["State your IV, DV and two controlled variables.","Which part of Criterion C do you feel least confident about?"],
 teacher:{timing:[["0–10","Unpack Criterion B/C strands with annotated exemplars (low/mid/high)."],["10–25","Students choose an investigation; complete planner tool (IV, DV, CVs, hypothesis)."],["25–50","Data collection / data processing with the concordance calculator."],["50–60","Peer review of draft table and graph using criterion language; exit ticket."]],
  mis:["Changing more than one variable.","Controlled variables listed without saying how they are controlled.","Graph of raw trials instead of means; missing units/uncertainties.","Vague evaluation ('human error')."],
  support:"Criterion scaffold template sheets; sentence frames for hypothesis and evaluation; pre-drawn table.",

  el.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('c_')){d[e.target.id.slice(2)]=e.target.value;store.set('case',d)}});
  $('#cCopy').onclick=()=>{const txt=f.map(x=>x[1]+':\n'+(d[x[0]]||'')).join('\n\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Plan copied')).catch(()=>toast('Select the text and copy it manually'))};
 },
 inv(el){
  const IV={conc:["Concentration of HCl (mol/dm³)","Titre of HCl needed to neutralise 25.0 cm³ NaOH (cm³)","Volume and concentration of NaOH; indicator and number of drops; same burette and pipette; temperature"],type:["Type of acid (HCl vs H₂SO₄, same concentration)","Titre of acid (cm³)","Acid concentration; NaOH volume and concentration; indicator; temperature"],ant:["Brand of antacid tablet","Volume of 0.100 mol/dm³ HCl neutralised per tablet (cm³)","Mass of tablet (or one tablet each); acid concentration; indicator; tablet crushed the same way; temperature"],temp:["Volume of acid added (cm³)","Maximum temperature rise (°C)","Concentration of acid and alkali; volume of alkali; insulated cup; same thermometer; starting temperature"]};
  const d=store.get('inv',{iv:'conc',rows:[["0.050","","",""],["0.100","","",""],["0.150","","",""],["0.200","","",""]]});
  el.innerHTML='<div class="tool"><span class="tool-h">Investigation planner + concordance calculator</span><label for="ivSel"><b>Choose your investigation</b></label><select id="ivSel"><option value="conc">Effect of acid concentration on titre</option><option value="type">Type of acid</option><option value="ant">Antacid brands</option><option value="temp">Temperature rise (thermometric)</option></select><div class="readout" id="ivR"></div>'+
   '<label for="hyp"><b>Hypothesis</b> (If … then … because …)</label><textarea id="hyp">'+esc(d.hyp||'')+'</textarea>'+
   '<b>Raw and processed data</b><p class="hint">Enter titres to 2 d.p. The mean uses only concordant values (within 0.10 cm³).</p><div class="tablewrap"><table class="data"><thead><tr><th>IV value</th><th>Trial 1 / cm³ ±0.05</th><th>Trial 2 / cm³ ±0.05</th><th>Trial 3 / cm³ ±0.05</th><th>Mean / cm³</th><th>Concordant?</th></tr></thead><tbody id="ivB"></tbody></table></div><div class="row"><button class="btn ghost" id="ivAdd">Add row</button><button class="btn ghost" id="ivCopy">Copy table</button></div>'+
   '<div class="card"><h4>Evaluation frame</h4><p>My hypothesis is <i>supported / partly supported / not supported</i> because the data show … One source of error was … which made my titres too <i>high / low</i>. To improve, I would … To extend, I could …</p></div></div>';
  const meanC=t=>{const v=t.map(Number).filter(x=>x>0);if(v.length<2)return[null,'—'];let best=null;for(let i=0;i<v.length;i++)for(let j=i+1;j<v.length;j++)if(Math.abs(v[i]-v[j])<=0.1001){const grp=v.filter(x=>Math.abs(x-v[i])<=0.1001&&Math.abs(x-v[j])<=0.1001);if(!best||grp.length>best.length)best=grp}
   if(!best)return[v.reduce((a,b)=>a+b,0)/v.length,'No — repeat'];return[best.reduce((a,b)=>a+b,0)/best.length,'Yes ('+best.length+')']};
  const body=()=>{$('#ivB').innerHTML=d.rows.map((r,i)=>{const m=meanC(r.slice(1));return '<tr><td><input type="text" data-r="'+i+'" data-c="0" value="'+esc(r[0])+'" aria-label="IV value row '+(i+1)+'"></td>'+[1,2,3].map(c=>'<td><input type="number" step="0.05" data-r="'+i+'" data-c="'+c+'" value="'+esc(r[c])+'" aria-label="Trial '+c+' row '+(i+1)+'"></td>').join('')+'<td class="mono" data-m="'+i+'">'+(m[0]==null?'—':m[0].toFixed(2))+'</td><td data-k="'+i+'">'+m[1]+'</td></tr>'}).join('')};
  const ivR=()=>{const x=IV[d.iv];$('#ivSel').value=d.iv;$('#ivR').innerHTML='<div><small>Independent variable</small><b style="font-family:var(--f-body)">'+x[0]+'</b></div><div><small>Dependent variable</small><b style="font-family:var(--f-body)">'+x[1]+'</b></div><div style="grid-column:1/-1"><small>Controlled variables (say how you control each)</small><b style="font-family:var(--f-body)">'+x[2]+'</b></div>'};
  el.addEventListener('input',e=>{const t=e.target;if(t.dataset.r!=null){d.rows[+t.dataset.r][+t.dataset.c]=t.value;store.set('inv',d);const i=+t.dataset.r;const m=meanC(d.rows[i].slice(1));el.querySelector('[data-m="'+i+'"]').textContent=m[0]==null?'—':m[0].toFixed(2);el.querySelector('[data-k="'+i+'"]').textContent=m[1]}else if(t.id==='hyp'){d.hyp=t.value;store.set('inv',d)}});
  $('#ivSel').onchange=e=>{d.iv=e.target.value;store.set('inv',d);ivR()};
  $('#ivAdd').onclick=()=>{d.rows.push(["","","",""]);store.set('inv',d);body()};
  $('#ivCopy').onclick=()=>{const txt='IV\tTrial 1\tTrial 2\tTrial 3\tMean\n'+d.rows.map(r=>{const m=meanC(r.slice(1));return r.join('\t')+'\t'+(m[0]==null?'':m[0].toFixed(2))}).join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Table copied — paste into Sheets or Excel')).catch(()=>toast('Copy not available here'))};
  ivR();body();
 }
};

/* ---------------- ROUTER & EVENTS ---------------- */
function go(){
  let id=(location.hash||'#overview').slice(1);const l=L.find(x=>x.id===id);if(!l&&id!=='planner')id='overview';
  speechStop();rail(id);
  $('#main').innerHTML=l?lesson(l):id==='planner'?planner():overview();
  if(l&&l.tool&&TOOLS[l.tool])TOOLS[l.tool]($('#tool'));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',go);

$('#main').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=(location.hash||'').slice(1);
  if(b.hasAttribute('data-say')){speak(b.closest('section'),b);return}
  if(b.dataset.copy!=null){const p=PLAN[+b.dataset.copy];let txt=p.s+'\nUDL guidelines: '+p.g.join(', ')+'\n\n'+p.i.map(x=>'• '+plain(x)).join('\n');
   if(p.bo)txt+='\n\nLesson | Barrier | Option\n'+L.map(l=>l.code+' | '+BO[l.id][0]+' | '+BO[l.id][1]).join('\n');
   (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied — paste into ManageBac')).catch(()=>toast('Copy blocked: select the text and copy it'));return}
  const we=b.closest('.we');
  if(we){const items=[...we.querySelectorAll('li')];if(b.hasAttribute('data-next')){const n=items.find(x=>x.hidden);if(n)n.hidden=false;if(!items.some(x=>x.hidden))b.disabled=true}
   if(b.hasAttribute('data-all')){items.forEach(x=>x.hidden=false);we.querySelector('[data-next]').disabled=true}
   if(b.hasAttribute('data-reset')){items.forEach((x,i)=>x.hidden=i>0);we.querySelector('[data-next]').disabled=false}return}
  if(b.dataset.o!=null){const q=b.closest('.q');const l=L.find(x=>x.id===id);const p=l.practice[+q.dataset.q];const ok=+b.dataset.o===p.c;
   b.classList.add(ok?'right':'wrong');const f=q.querySelector('.fb');f.hidden=false;f.className='fb '+(ok?'ok':'no');f.innerHTML=(ok?'Correct. ':'Not quite — try again. Hint: ')+(ok?esc(p.w):esc(p.w.split(/[.;]/)[0])+'.');
   if(ok)q.querySelectorAll('.q-opts button').forEach(x=>x.disabled=true);return}
  if(b.dataset.choice!=null){store.set('choice_'+id,+b.dataset.choice);b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));toast('Route chosen: '+b.querySelector('b').textContent);return}
  if(b.dataset.express!=null){store.set('express_'+id,+b.dataset.express);b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));toast('Task chosen: '+b.querySelector('b').textContent);return}
  if(b.dataset.rate){const r=store.get('rate',{});r[id]=+b.dataset.rate;store.set('rate',r);b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));rail(id);toast('Confidence saved');return}
});
$('#main').addEventListener('change',e=>{if(e.target.dataset.ck!=null){const ck=store.get('ck',[false,false,false]);ck[+e.target.dataset.ck]=e.target.checked;store.set('ck',ck)}});
$('#main').addEventListener('input',e=>{if(e.target.id==='exitNotes')store.set('exit_'+(location.hash||'').slice(1),e.target.value)});

/* read aloud */
let speaking=null;
function speechStop(){try{speechSynthesis.cancel()}catch(e){}if(speaking){speaking.textContent='Read aloud';speaking=null}}
function speak(sec,btn){
  if(!('speechSynthesis' in window)){toast('Read aloud is not available in this browser');return}
  if(speaking===btn){speechStop();return}speechStop();
  const c=sec.cloneNode(true);c.querySelectorAll('button,.godinline,.godpanel').forEach(x=>x.remove());
  const u=new SpeechSynthesisUtterance(c.textContent.replace(/\s+/g,' ').trim());u.lang='en-GB';u.rate=.95;u.onend=()=>speechStop();
  speaking=btn;btn.textContent='Stop';speechSynthesis.speak(u);
}

/* toolbar */
const pref=store.get('pref',{fs:17,sp:false,fo:false});
function applyPref(){document.documentElement.style.setProperty('--fs',pref.fs+'px');
  document.documentElement.style.setProperty('--lh',pref.sp?'1.9':'1.6');document.documentElement.style.setProperty('--ls',pref.sp?'0.04em':'0');
  $('#tSpace').setAttribute('aria-pressed',pref.sp);$('#tFocus').setAttribute('aria-pressed',pref.fo);document.body.classList.toggle('focus',pref.fo);store.set('pref',pref)}
$('#tBigger').onclick=()=>{pref.fs=Math.min(24,pref.fs+1);applyPref()};
$('#tSmaller').onclick=()=>{pref.fs=Math.max(14,pref.fs-1);applyPref()};
$('#tSpace').onclick=()=>{pref.sp=!pref.sp;applyPref()};
$('#tFocus').onclick=()=>{pref.fo=!pref.fo;applyPref();toast(pref.fo?'Focus mode: extra choices hidden':'All sections shown')};
function setGod(on){document.body.classList.toggle('god',on);$('#tGod').setAttribute('aria-pressed',on);$('#godLock').hidden=true;document.dispatchEvent(new Event('godchange'));toast(on?'God mode on: teacher notes and answers visible':'God mode off')}
$('#tGod').onclick=()=>{if(document.body.classList.contains('god')){setGod(false);return}const lk=$('#godLock');lk.hidden=!lk.hidden;if(!lk.hidden)$('#godCode').focus()};
const tryGod=()=>{if($('#godCode').value.trim().toUpperCase()==='BMIS'){$('#godCode').value='';setGod(true)}else toast('Incorrect teacher code')};
$('#godGo').onclick=tryGod;$('#godCode').addEventListener('keydown',e=>{if(e.key==='Enter')tryGod()});
/* glossary */
function gl(q){q=(q||'').toLowerCase();$('#glossList').innerHTML=GL.filter(v=>!q||v[0].toLowerCase().includes(q)||v[1].toLowerCase().includes(q)).map(v=>'<div><b>'+esc(v[0])+'</b>'+esc(v[1])+'</div>').join('')||'<p class="hint">No match.</p>'}
$('#tGloss').onclick=()=>{$('#glossary').hidden=false;gl('');$('#glossSearch').focus()};
$('#glossClose').onclick=()=>$('#glossary').hidden=true;
$('#glossSearch').addEventListener('input',e=>gl(e.target.value));
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#glossary').hidden=true});

applyPref();go();
})();
</script>

</body></html>
